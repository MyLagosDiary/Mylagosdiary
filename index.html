<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />
  <title>MyLagosDiary — Dollhouse Test</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      touch-action: none;
      font-family: Arial, sans-serif;
      -webkit-user-select: none;
      user-select: none;
    }

    canvas {
      display: block;
      touch-action: none;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.72);
      color: white;
      font-size: 18px;
      font-weight: 700;
      z-index: 100;
      text-align: center;
      padding: 20px;
    }

    #fade {
      position: fixed;
      inset: 0;
      background: #000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.9s ease;
      z-index: 60;
    }

    #fade.on {
      opacity: 1;
      pointer-events: auto;
    }

    .hud {
      position: fixed;
      left: 0;
      right: 0;
      top: max(12px, env(safe-area-inset-top));
      padding: 0 12px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      color: white;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.45);
      z-index: 20;
    }

    .panel {
      background: rgba(0, 0, 0, 0.35);
      border-radius: 18px;
      padding: 10px 12px;
      backdrop-filter: blur(8px);
      font-size: 14px;
      line-height: 1.6;
      min-width: 120px;
    }

    .bar {
      display: inline-block;
      width: 88px;
      height: 8px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 99px;
      overflow: hidden;
      vertical-align: middle;
      margin-left: 4px;
    }

    .bar > div {
      height: 100%;
      width: 100%;
      border-radius: 99px;
      transition: width 0.3s ease;
    }

    #energyBar > div,
    #energyBar {
      background: #7ed957;
    }

    #hungerBar {
      background: #ffb703;
    }

    .hint {
      position: fixed;
      top: max(96px, calc(env(safe-area-inset-top) + 88px));
      left: 50%;
      transform: translateX(-50%);
      color: white;
      background: rgba(0, 0, 0, 0.45);
      border-radius: 16px;
      padding: 8px 12px;
      font-size: 11px;
      z-index: 20;
      pointer-events: none;
      max-width: 86%;
      text-align: center;
      backdrop-filter: blur(6px);
    }

    .iconBtn {
      position: fixed;
      right: 14px;
      bottom: max(16px, env(safe-area-inset-bottom));
      width: 54px;
      height: 54px;
      border-radius: 50%;
      border: 0;
      font-size: 24px;
      background: rgba(0, 0, 0, 0.45);
      color: white;
      z-index: 35;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3);
    }

    .iconBtn:active {
      transform: scale(0.96);
    }

    #actionSheet {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: max(14px, env(safe-area-inset-bottom));
      background: rgba(18, 18, 24, 0.94);
      border-radius: 22px;
      padding: 14px;
      z-index: 40;
      transform: translateY(130%);
      transition: transform 0.28s ease;
      backdrop-filter: blur(10px);
    }

    #actionSheet.open {
      transform: translateY(0);
    }

    #sheetTitle {
      color: white;
      font-weight: 800;
      font-size: 15px;
      margin: 0 4px 10px;
    }

    .sheetBtn {
      display: block;
      width: 100%;
      margin: 6px 0;
      border: 0;
      border-radius: 16px;
      padding: 13px 14px;
      font-size: 15px;
      font-weight: 700;
      color: white;
      background: #2e7d32;
      text-align: left;
    }

    .sheetBtn:active {
      transform: scale(0.99);
    }

    .sheetBtn.cancel {
      background: #4a4a52;
      text-align: center;
    }

    #toast {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: max(110px, calc(env(safe-area-inset-bottom) + 100px));
      background: rgba(0, 0, 0, 0.75);
      color: white;
      padding: 10px 14px;
      border-radius: 999px;
      display: none;
      z-index: 50;
      white-space: nowrap;
      font-weight: 700;
    }

    #diaryPanel {
      position: fixed;
      inset: 8% 7%;
      background: rgba(255, 248, 235, 0.97);
      color: #3a3226;
      border-radius: 18px;
      padding: 16px;
      overflow: auto;
      z-index: 80;
      display: none;
      font-family: Georgia, serif;
      font-size: 14px;
      line-height: 1.55;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    }

    #diaryPanel h2 {
      margin: 0 0 10px;
      font-size: 18px;
      font-style: italic;
    }

    .entry {
      margin-bottom: 12px;
      border-bottom: 1px dashed #b9a98c;
      padding-bottom: 10px;
      white-space: pre-wrap;
    }

    #diaryClose {
      position: sticky;
      top: 0;
      float: right;
      background: #6d5a3f;
      color: white;
      border: 0;
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 700;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>

<body>
  <div id="loading">Loading Dollhouse Test...</div>
  <div id="fade"></div>

  <div class="hud">
    <div class="panel">
      <div><b>MyLagosDiary</b></div>
      <div>⚡<span class="bar" id="energyBar"><div></div></span></div>
      <div>🍲<span class="bar" id="hungerBar"><div></div></span></div>
    </div>

    <div class="panel">
      <div><b>₦<span id="money">1,000</span></b></div>
      <div>Day <span id="day">1</span> • <span id="clock">08:00</span></div>
    </div>
  </div>

  <div class="hint" id="hint">
    Tap objects for actions • Tap floor to move • Drag rotate • Pinch zoom
  </div>

  <button id="diaryBtn" class="iconBtn">📔</button>

  <div id="actionSheet">
    <div id="sheetTitle"></div>
    <div id="sheetBtns"></div>
  </div>

  <div id="toast"></div>

  <div id="diaryPanel">
    <button id="diaryClose">Close</button>
    <h2>My Lagos Diary</h2>
    <div id="diaryContent"></div>
  </div>

  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

    const state = {
      money: 1000,
      energy: 100,
      hunger: 100,
      minutes: 8 * 60,
      day: 1,
      diary: [],
      todayEvents: ["Started the day with ₦1,000 for pocket."]
    };

    const energyBar = document.querySelector("#energyBar > div");
    const hungerBar = document.querySelector("#hungerBar > div");
    const moneyEl = document.getElementById("money");
    const clockEl = document.getElementById("clock");
    const dayEl = document.getElementById("day");
    const toastEl = document.getElementById("toast");
    const loadingEl = document.getElementById("loading");
    const hintEl = document.getElementById("hint");
    const fadeEl = document.getElementById("fade");
    const diaryPanel = document.getElementById("diaryPanel");
    const diaryContent = document.getElementById("diaryContent");
    const actionSheet = document.getElementById("actionSheet");
    const sheetTitle = document.getElementById("sheetTitle");
    const sheetBtns = document.getElementById("sheetBtns");

    const clamp = (value, min, max) => Math.max(min, Math.min(max, value));

    function clockString() {
      const hours24 = Math.floor(state.minutes / 60) % 24;
      const mins = Math.floor(state.minutes % 60);
      const pad = (n) => String(n).padStart(2, "0");
      return `${pad(hours24)}:${pad(mins)}`;
    }

    function logEvent(text) {
      state.todayEvents.push(clockString() + " — " + text);
    }

    function updateHUD() {
      state.energy = clamp(state.energy, 0, 100);
      state.hunger = clamp(state.hunger, 0, 100);

      energyBar.style.width = Math.round(state.energy) + "%";
      hungerBar.style.width = Math.round(state.hunger) + "%";
      moneyEl.textContent = state.money.toLocaleString();
      dayEl.textContent = state.day;
      clockEl.textContent = clockString();

      updateDayNight();
    }

    function addMinutes(minutes) {
      state.minutes = (state.minutes + minutes) % (24 * 60);
      updateHUD();
    }

    function showToast(message) {
      toastEl.textContent = message;
      toastEl.style.display = "block";

      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => {
        toastEl.style.display = "none";
      }, 1800);
    }

    function hideLoading() {
      loadingEl.style.display = "none";
    }

    let hintTimer = null;
    function showHint(text, seconds) {
      hintEl.textContent = text;
      hintEl.style.display = "block";
      clearTimeout(hintTimer);
      hintTimer = setTimeout(() => {
        hintEl.style.display = "none";
      }, seconds * 1000);
    }

    setTimeout(() => {
      hintEl.style.display = "none";
    }, 7000);

    let sleeping = false;

    document.getElementById("diaryBtn").addEventListener("click", () => {
      if (sleeping) return;
      closeSheet();
      renderDiary();
      diaryPanel.style.display = "block";
    });

    document.getElementById("diaryClose").addEventListener("click", () => {
      diaryPanel.style.display = "none";
    });

    function renderDiary() {
      let html = "";
      html += `<div class="entry"><b>Today (Day ${state.day})</b><br>${state.todayEvents.join("<br>")}</div>`;
      const past = [...state.diary].reverse();
      for (const entry of past) {
        html += `<div class="entry">${entry}</div>`;
      }
      diaryContent.innerHTML = html;
    }

    const closings = [
      "VI still dey shine across the water. One day.",
      "Body tire, but spirit no dey shake.",
      "Small small, we dey go.",
      "Lagos no dey carry last, and I no go carry last either.",
      "Tomorrow na another hustle."
    ];

    function writeDayEntry(finishedDay) {
      const closing = closings[finishedDay % closings.length];
      const entry = `Day ${finishedDay} — ${state.todayEvents.join(" ")} ${closing}`;
      state.diary.push(entry);
      state.todayEvents = ["Woke up fresh for morning."];
    }

    const scene = new THREE.Scene();
    scene.background = new THREE.Color("#bfe9ff");
    scene.fog = new THREE.Fog("#bfe9ff", 25, 65);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    document.body.appendChild(renderer.domElement);

    const hemi = new THREE.HemisphereLight("#ffffff", "#d8c9a3", 1.15);
    scene.add(hemi);

    const sun = new THREE.DirectionalLight("#fff1d0", 2.4);
    sun.position.set(6, 10, 4);
    sun.castShadow = true;
    sun.shadow.mapSize.set(1024, 1024);
    sun.shadow.camera.left = -14; sun.shadow.camera.right = 14;
    sun.shadow.camera.top = 14; sun.shadow.camera.bottom = -14;
    sun.shadow.camera.near = 1; sun.shadow.camera.far = 40;
    scene.add(sun);

    const dayColor = new THREE.Color("#bfe9ff");
    const nightColor = new THREE.Color("#0b1026");
    let lampShade = null;

    function updateDayNight() {
      const h = state.minutes / 60;
      let light;

      if (h >= 7 && h < 17) light = 1;
      else if (h >= 17 && h < 20) light = 1 - (h - 17) / 3;
      else if (h >= 5 && h < 7) light = (h - 5) / 2;
      else light = 0;

      scene.background.copy(nightColor).lerp(dayColor, light);
      scene.fog.color.copy(scene.background);

      hemi.intensity = 0.25 + 0.95 * light;
      sun.intensity = 0.25 + 2.15 * light;

      if (lampShade) {
        lampShade.material.emissiveIntensity = 0.35 + 1.4 * (1 - light);
      }
    }

    const tapMeshes = [];
    const interactiveObjects = [];
    let foodMesh = null;

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(80, 80),
      new THREE.MeshStandardMaterial({ color: "#88b06a", roughness: 0.95 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);
    tapMeshes.push(ground);

    const roomFloor = new THREE.Mesh(
      new THREE.PlaneGeometry(10, 10),
      new THREE.MeshStandardMaterial({ color: "#d7b083", roughness: 0.9 })
    );
    roomFloor.rotation.x = -Math.PI / 2;
    roomFloor.position.y = 0.01;
    roomFloor.receiveShadow = true;
    scene.add(roomFloor);
    tapMeshes.push(roomFloor);

    const rug = new THREE.Mesh(
      new THREE.CircleGeometry(2.2, 32),
      new THREE.MeshStandardMaterial({ color: "#d96f4e", roughness: 0.95 })
    );
    rug.rotation.x = -Math.PI / 2;
    rug.position.y = 0.02;
    rug.receiveShadow = true;
    scene.add(rug);

    function makeWall(x, z, rotationY) {
      const wall = new THREE.Mesh(
        new THREE.PlaneGeometry(10, 3),
        new THREE.MeshStandardMaterial({ color: "#f6efe3", roughness: 0.95, side: THREE.FrontSide })
      );
      wall.position.set(x, 1.5, z);
      wall.rotation.y = rotationY;
      wall.receiveShadow = true;
      scene.add(wall);
    }

    makeWall(0, -5, 0);
    makeWall(0, 5, Math.PI);
    makeWall(-5, 0, Math.PI / 2);
    makeWall(5, 0, -Math.PI / 2);

    function makeBox(w, h, d, color, x, y, z) {
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(w, h, d),
        new THREE.MeshStandardMaterial({ color, roughness: 0.82, metalness: 0.04 })
      );
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);
      return mesh;
    }

    function makeCylinder(radiusTop, radiusBottom, height, color, x, y, z) {
      const mesh = new THREE.Mesh(
        new THREE.CylinderGeometry(radiusTop, radiusBottom, height, 24),
        new THREE.MeshStandardMaterial({ color, roughness: 0.82, metalness: 0.04 })
      );
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);
      return mesh;
    }

    let m;

    m = makeBox(2.1, 0.32, 3.3, "#8a5a3b", -3.1, 0.16, -2.6); m.userData.type = "bed"; interactiveObjects.push(m);
    m = makeBox(1.9, 0.22, 3.1, "#f3f3f3", -3.1, 0.43, -2.6); m.userData.type = "bed"; interactiveObjects.push(m);
    m = makeBox(1.5, 0.16, 0.7, "#d9e8ff", -3.1, 0.58, -3.8); m.userData.type = "bed"; interactiveObjects.push(m);

    m = makeCylinder(0.75, 0.75, 0.08, "#8a5a3b", 1.8, 0.75, -1.8); m.userData.type = "table"; interactiveObjects.push(m);
    m = makeCylinder(0.08, 0.08, 0.72, "#6d4429", 1.8, 0.36, -1.8); m.userData.type = "table"; interactiveObjects.push(m);
    m = makeCylinder(0.24, 0.24, 0.03, "#ffffff", 1.8, 0.81, -1.8); m.userData.type = "table"; interactiveObjects.push(m);
    foodMesh = makeCylinder(0.13, 0.13, 0.05, "#e07a2f", 1.8, 0.84, -1.8); foodMesh.userData.type = "table"; interactiveObjects.push(foodMesh);

    m = makeBox(0.55, 0.07, 0.55, "#7c4f2a", 1.8, 0.45, -0.7); m.userData.type = "chair"; interactiveObjects.push(m);
    m = makeBox(0.55, 0.65, 0.07, "#7c4f2a", 1.8, 0.82, -0.45); m.userData.type = "chair"; interactiveObjects.push(m);

    m = makeBox(0.8, 0.5, 0.6, "#c98a4b", -4.0, 0.25, 1.8); m.userData.type = "basket"; interactiveObjects.push(m);
    m = makeBox(0.6, 0.12, 0.45, "#8fbf6f", -4.0, 0.55, 1.8); m.userData.type = "basket"; interactiveObjects.push(m);

    makeCylinder(0.04, 0.04, 1.6, "#444444", -4.2, 0.8, -4.2);
    lampShade = new THREE.Mesh(
      new THREE.CylinderGeometry(0.22, 0.32, 0.35, 24),
      new THREE.MeshStandardMaterial({ color: "#ffd166", emissive: "#ffb703", emissiveIntensity: 0.35, roughness: 0.6 })
    );
    lampShade.position.set(-4.2, 1.65, -4.2);
    lampShade.castShadow = true;
    scene.add(lampShade);

    const marker = new THREE.Mesh(
      new THREE.RingGeometry(0.24, 0.34, 32),
      new THREE.MeshBasicMaterial({ color: "#ffffff", transparent: true, opacity: 0.9, depthWrite: false })
    );
    marker.rotation.x = -Math.PI / 2;
    marker.visible = false;
    scene.add(marker);

    const player = new THREE.Group();
    player.position.set(0, 0, 1.5);
    scene.add(player);

    const spots = {
      bedApproach: new THREE.Vector3(-1.75, 0, -2.6),
      bedLie: new THREE.Vector3(-3.1, 0.62, -1.8),
      chairApproach: new THREE.Vector3(1.05, 0, 0.2),
      chairSit: new THREE.Vector3(1.8, 0, -0.7),
      tableApproach: new THREE.Vector3(0.95, 0, -1.8),
      tableCenter: new THREE.Vector3(1.8, 0, -1.8),
      basketApproach: new THREE.Vector3(-2.9, 0, 1.8),
      basketCenter: new THREE.Vector3(-4.0, 0, 1.8)
    };

    let mixer = null;
    let actions = {};
    let activeAction = null;
    let isMoving = false;
    let target = null;
    let pendingAction = null;
    let posture = "stand";
    let transition = null;

    function playAction(name) {
      const next = actions[name];
      if (!next) return;
      if (activeAction === next) return;

      next.reset();
      next.setEffectiveTimeScale(1);
      next.setEffectiveWeight(1);
      next.setLoop(THREE.LoopRepeat, Infinity);
      next.fadeIn(0.25);
      next.play();

      if (activeAction) activeAction.fadeOut(0.25);
      activeAction = next;
    }

    function playOneShot(name) {
      const next = actions[name];
      if (!next) return;

      next.reset();
      next.setLoop(THREE.LoopOnce, 1);
      next.clampWhenFinished = true;
      next.setEffectiveWeight(1);
      next.fadeIn(0.15);
      next.play();

      if (activeAction) activeAction.fadeOut(0.15);
      activeAction = next;
    }

    function startTransition(opts) {
      transition = {
        t: 0,
        dur: opts.dur,
        fromPos: player.position.clone(),
        toPos: opts.toPos.clone(),
        fromRot: { x: player.rotation.x, y: player.rotation.y, z: player.rotation.z },
        toRot: { x: opts.toRot.x, y: opts.toRot.y, z: opts.toRot.z },
        onDone: opts.onDone || null
      };

      if (opts.blend) playAction(opts.blend);
    }

    function standUpThen(callback) {
      if (posture === "stand") {
        callback();
        return;
      }

      posture = "stand";

      startTransition({
        toPos: new THREE.Vector3(player.position.x, 0, player.position.z),
        toRot: { x: 0, y: player.rotation.y, z: 0 },
        dur: 0.35,
        blend: "idle",
        onDone: callback
      });
    }

    function startSleep() {
      sleeping = true;
      logEvent("Lie down for bed make sleep carry me.");

      setTimeout(() => {
        fadeEl.classList.add("on");

        setTimeout(() => {
          writeDayEntry(state.day);
          state.day += 1;
          state.minutes = 8 * 60;
          state.energy = 100;
          state.hunger = Math.max(0, state.hunger - 20);
          foodMesh.visible = true;
          updateHUD();

          posture = "stand";
          player.position.copy(spots.bedApproach);
          player.rotation.set(0, -Math.PI / 2, 0);
          playAction("idle");

          fadeEl.classList.remove("on");
          showToast("You sleep well. Day " + state.day + " don break.");

          setTimeout(() => {
            sleeping = false;
          }, 900);
        }, 1500);
      }, 1100);
    }

    function executeAction(type) {
      if (type === "bed") {
        posture = "lie";

        startTransition({
          toPos: spots.bedApproach,
          toRot: { x: 0, y: -Math.PI / 2, z: 0 },
          dur: 0.35,
          blend: "idle",
          onDone: () => {
            startTransition({
              toPos: spots.bedLie,
              toRot: { x: -Math.PI / 2, y: 0, z: 0 },
              dur: 0.7,
              blend: "idle",
              onDone: startSleep
            });
          }
        });
      } else if (type === "nap") {
        startTransition({
          toPos: spots.bedApproach,
          toRot: { x: 0, y: -Math.PI / 2, z: 0 },
          dur: 0.35,
          blend: "idle",
          onDone: () => {
            state.energy += 25;
            state.hunger -= 8;
            addMinutes(60);
            logEvent("Napped small for bedside.");
            showToast("You nap small. Body refresh.");
            updateHUD();
          }
        });
      } else if (type === "chair") {
        posture = "sit";

        startTransition({
          toPos: spots.chairSit,
          toRot: { x: 0, y: Math.PI, z: 0 },
          dur: 0.55,
          blend: actions.sit ? "sit" : "idle",
          onDone: () => {
            logEvent("Sat down small to rest mind.");
            showToast("You sit down small.");
          }
        });
      } else if (type === "table") {
        const dirToTable = spots.tableCenter.clone().sub(player.position);
        const faceYaw = Math.atan2(dirToTable.x, dirToTable.z);

        startTransition({
          toPos: player.position.clone(),
          toRot: { x: 0, y: faceYaw, z: 0 },
          dur: 0.3,
          blend: "idle",
          onDone: () => {
            if (state.money < 350) {
              showToast("No money for food");
              return;
            }

            state.money -= 350;
            state.hunger = clamp(state.hunger + 50, 0, 100);
            addMinutes(20);
            logEvent("Chop home food from table.");

            foodMesh.visible = false;
            playOneShot("thumbs");
            showToast("You chop home food. Body sweet you.");
            updateHUD();
          }
        });
      } else if (type === "basket") {
        const dirToBasket = spots.basketCenter.clone().sub(player.position);
        const faceYaw = Math.atan2(dirToBasket.x, dirToBasket.z);

        startTransition({
          toPos: player.position.clone(),
          toRot: { x: 0, y: faceYaw, z: 0 },
          dur: 0.3,
          blend: "idle",
          onDone: () => {
            if (state.energy < 10) {
              showToast("You no get energy");
              return;
            }
            if (state.hunger < 10) {
              showToast("You too hungry to hustle");
              return;
            }

            state.money += 40;
            state.energy -= 10;
            state.hunger -= 5;
            addMinutes(10);
            logEvent("Sorted catch for basket, earned ₦40.");
            playOneShot("thumbs");
            showToast("+₦40 from catch sorting");
            updateHUD();
          }
        });
      }
    }

    function sheetDefs(type) {
      if (type === "bed") {
        return {
          title: "Bed",
          items: [
            { label: "😴 Sleep till morning", act: "sleep" },
            { label: "💤 Nap (1 hour)", act: "nap" }
          ]
        };
      }
      if (type === "chair") {
        if (posture === "sit") {
          return { title: "Chair", items: [{ label: "🧍 Stand up", act: "standup" }] };
        }
        return { title: "Chair", items: [{ label: "🪑 Sit down", act: "sit" }] };
      }
      if (type === "table") {
        return { title: "Table", items: [{ label: "🍲 Eat home food ₦350", act: "eat" }] };
      }
      if (type === "basket") {
        return { title: "Work basket", items: [{ label: "🐟 Sort catch (+₦40)", act: "hustle" }] };
      }
      return null;
    }

    function openSheet(type) {
      const def = sheetDefs(type);
      if (!def) return;

      sheetTitle.textContent = def.title;
      sheetBtns.innerHTML = "";

      for (const item of def.items) {
        const btn = document.createElement("button");
        btn.className = "sheetBtn";
        btn.textContent = item.label;
        btn.addEventListener("click", () => {
          closeSheet();
          chooseAction(item.act);
        });
        sheetBtns.appendChild(btn);
      }

      const cancel = document.createElement("button");
      cancel.className = "sheetBtn cancel";
      cancel.textContent = "Cancel";
      cancel.addEventListener("click", closeSheet);
      sheetBtns.appendChild(cancel);

      actionSheet.classList.add("open");
    }

    function closeSheet() {
      actionSheet.classList.remove("open");
    }

    function chooseAction(act) {
      if (act === "sleep") {
        pendingAction = "bed";
        setMoveTarget(spots.bedApproach);
      } else if (act === "nap") {
        pendingAction = "nap";
        setMoveTarget(spots.bedApproach);
      } else if (act === "sit") {
        pendingAction = "chair";
        setMoveTarget(spots.chairApproach);
      } else if (act === "standup") {
        standUpThen(() => {});
      } else if (act === "eat") {
        pendingAction = "table";
        setMoveTarget(spots.tableApproach);
      } else if (act === "hustle") {
        pendingAction = "basket";
        setMoveTarget(spots.basketApproach);
      }
    }

    function createPlaceholderCharacter() {
      const bodyMat = new THREE.MeshStandardMaterial({ color: "#8d6e63", roughness: 0.75 });
      const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.35, 0.9, 8, 16), bodyMat);
      body.position.y = 0.95;
      body.castShadow = true;

      const head = new THREE.Mesh(new THREE.SphereGeometry(0.28, 24, 24), new THREE.MeshStandardMaterial({ color: "#a9825f", roughness: 0.7 }));
      head.position.y = 1.78;
      head.castShadow = true;

      player.add(body, head);
      hideLoading();
    }

    const loader = new GLTFLoader();
    const modelUrl = "https://threejs.org/examples/models/gltf/Xbot.glb";

    loader.load(
      modelUrl,
      (gltf) => {
        const model = gltf.scene;
        model.scale.setScalar(1.02);
        model.traverse((child) => {
          if (child.isMesh) {
            child.castShadow = true;
            child.receiveShadow = true;
          }
        });
        player.add(model);

        mixer = new THREE.AnimationMixer(model);
        const clips = gltf.animations || [];

        showHint("ANIMS: " + clips.map((c) => c.name).join(", "), 20);

        function findClip(names) {
          for (const name of names) {
            const clip = clips.find((c) => c.name.toLowerCase().includes(name));
            if (clip) return clip;
          }
          return null;
        }

        const idleClip = findClip(["idle", "breath"]) || clips[0] || null;
        const walkClip = findClip(["walk", "walking"]) || clips[1] || idleClip;
        const sitClip = findClip(["sitting", "sit"]) || null;
        const thumbsClip = findClip(["thumbs", "thumb"]) || null;

        if (idleClip) actions.idle = mixer.clipAction(idleClip);
        if (walkClip) actions.walk = mixer.clipAction(walkClip);
        if (sitClip) actions.sit = mixer.clipAction(sitClip);
        if (thumbsClip) actions.thumbs = mixer.clipAction(thumbsClip);

        mixer.addEventListener("finished", () => {
          if (posture === "sit") {
            playAction("sit");
          } else if (posture === "stand" && !isMoving && !transition) {
            playAction("idle");
          }
        });

        playAction("idle");
        hideLoading();
      },
      undefined,
      (error) => {
        console.error("Model load error:", error);
        createPlaceholderCharacter();
        showToast("Character model failed. Using placeholder.");
      }
    );

    const raycaster = new THREE.Raycaster();
    const pointerNdc = new THREE.Vector2();

    const activePointers = new Map();
    let startX = 0;
    let startY = 0;
    let moved = false;
    let pinching = false;
    let lastPinchDistance = 0;

    let yaw = 0.65;
    let pitch = 0.98;
    let distance = 6.4;

    function getPinchDistance() {
      const points = [...activePointers.values()];
      if (points.length < 2) return 0;
      return Math.hypot(points[0].x - points[1].x, points[0].y - points[1].y);
    }

    function setMoveTarget(point) {
      target = new THREE.Vector3(point.x, 0, point.z);
      marker.position.set(point.x, 0.03, point.z);
      marker.visible = true;
    }

    function handleTap(event) {
      if (sleeping || transition) return;

      const rect = renderer.domElement.getBoundingClientRect();
      pointerNdc.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      pointerNdc.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(pointerNdc, camera);

      const objHits = raycaster.intersectObjects(interactiveObjects, false);
      if (objHits.length > 0) {
        const type = objHits[0].object.userData.type;
        openSheet(type);
        return;
      }

      const floorHits = raycaster.intersectObjects(tapMeshes, false);
      if (floorHits.length > 0) {
        closeSheet();
        pendingAction = null;
        const point = floorHits[0].point;

        if (posture !== "stand") {
          standUpThen(() => setMoveTarget(point));
        } else {
          setMoveTarget(point);
        }
      }
    }

    renderer.domElement.addEventListener("pointerdown", (event) => {
      activePointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
      if (activePointers.size === 1) {
        startX = event.clientX; startY = event.clientY; moved = false; pinching = false;
      } else if (activePointers.size === 2) {
        pinching = true; moved = true; lastPinchDistance = getPinchDistance();
      }
    });

    window.addEventListener("pointermove", (event) => {
      if (!activePointers.has(event.pointerId)) return;
      const prev = activePointers.get(event.pointerId);
      const dx = event.clientX - prev.x;
      const dy = event.clientY - prev.y;
      activePointers.set(event.pointerId, { x: event.clientX, y: event.clientY });

      if (activePointers.size === 1 && !pinching) {
        if (Math.abs(event.clientX - startX) > 8 || Math.abs(event.clientY - startY) > 8) moved = true;
        if (moved) {
          yaw -= dx * 0.006;
          pitch = clamp(pitch + dy * 0.004, 0.55, 1.25);
        }
      } else if (activePointers.size === 2) {
        moved = true;
        const currentPinchDistance = getPinchDistance();
        if (lastPinchDistance > 0 && currentPinchDistance > 0) {
          distance *= lastPinchDistance / currentPinchDistance;
          distance = clamp(distance, 3.5, 10);
        }
        lastPinchDistance = currentPinchDistance;
      }
    });

    function endPointer(event) {
      if (!activePointers.has(event.pointerId)) return;
      if (activePointers.size === 1 && !moved && !pinching) handleTap(event);
      activePointers.delete(event.pointerId);
      if (activePointers.size < 2) {
        lastPinchDistance = 0;
        if (activePointers.size === 0) pinching = false;
      }
    }

    window.addEventListener("pointerup", endPointer);
    window.addEventListener("pointercancel", endPointer);

    function lerpAngle(a, b, t) {
      let diff = (b - a) % (Math.PI * 2);
      if (diff > Math.PI) diff -= Math.PI * 2;
      if (diff < -Math.PI) diff += Math.PI * 2;
      return a + diff * clamp(t, 0, 1);
    }

    function handleMovement(delta) {
      if (!target) return;

      const direction = target.clone().sub(player.position);
      direction.y = 0;
      const dist = direction.length();

      if (dist > 0.12) {
        direction.normalize();
        const speed = 1.8;
        const step = Math.min(speed * delta, dist);
        player.position.addScaledVector(direction, step);

        const targetYaw = Math.atan2(direction.x, direction.z);
        player.rotation.y = lerpAngle(player.rotation.y, targetYaw, 12 * delta);

        if (!isMoving) {
          isMoving = true;
          playAction("walk");
        }
      } else {
        target = null;
        marker.visible = false;

        if (isMoving) {
          isMoving = false;
          playAction("idle");
        }

        if (pendingAction) {
          const action = pendingAction;
          pendingAction = null;
          executeAction(action);
        }
      }
    }

    function updateTransition(delta) {
      transition.t += delta;
      const k = Math.min(transition.t / transition.dur, 1);
      const e = k * k * (3 - 2 * k);

      player.position.lerpVectors(transition.fromPos, transition.toPos, e);

      player.rotation.x = transition.fromRot.x + (transition.toRot.x - transition.fromRot.x) * e;
      player.rotation.y = transition.fromRot.y + (transition.toRot.y - transition.fromRot.y) * e;
      player.rotation.z = transition.fromRot.z + (transition.toRot.z - transition.fromRot.z) * e;

      if (k >= 1) {
        const callback = transition.onDone;
        transition = null;
        if (callback) callback();
      }
    }

    function updateCamera() {
      const cosPitch = Math.cos(pitch);
      camera.position.set(
        player.position.x + Math.sin(yaw) * distance * cosPitch,
        player.position.y + Math.sin(pitch) * distance,
        player.position.z + Math.cos(yaw) * distance * cosPitch
      );
      camera.lookAt(player.position.x, player.position.y + 1.1, player.position.z);
    }

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const delta = Math.min(clock.getDelta(), 0.05);
      if (mixer) mixer.update(delta);

      if (transition) {
        updateTransition(delta);
      } else {
        handleMovement(delta);
      }

      updateCamera();
      renderer.render(scene, camera);
    }

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    updateHUD();
    updateCamera();
    animate();
  </script>
</body>
</html>
